[project]
name = "finance-companion-agent"
version = "0.1.0"
description = "The agent behind finance-companion: answers questions about the finance warehouse with A2UI surfaces."
requires-python = ">=3.12"
dependencies = [
    "a2ui-agent-sdk==0.12.1",
    "anthropic==2.13.0",
    "duckdb>=1.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finance_agent"]
