[project]
name = "finance-companion-agent"
version = "0.1.0"
description = "The agent behind finance-companion: answers questions about the finance warehouse with A2UI surfaces."
requires-python = ">=3.12"
dependencies = [
    "a2ui-agent-sdk==0.12.1",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
