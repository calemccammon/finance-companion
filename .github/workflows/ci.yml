name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agent:
    name: Agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      # Against the fixture warehouse and scripted models: no API key is needed.
      # Includes the checks that the shared catalog and recorded streams are current.
      - run: uv run pytest

  android-lint:
    name: Android static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # ktlint: formatting. detekt: code smells. lint: Android Lint, warnings as errors.
      - run: ./gradlew ktlintCheck detekt lint --continue
      # Every class the UI promises Compose is stable is checked field by field.
      - run: ./gradlew checkComposeStability -PcomposeReports --continue
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: lint-reports
          path: |
            android/**/build/reports/ktlint/
            android/**/build/reports/detekt/
            android/**/build/reports/lint-results-*.html
          retention-days: 14

  android-test:
    name: Android unit and screenshot tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # On the JVM; the renderer, Room and the screens run on Robolectric.
      - run: ./gradlew test testDebugUnitTest --continue
      # The screens are drawn and compared with the pictures in src/test/snapshots.
      - run: ./gradlew verifyRoborazziDebug --continue
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: |
            android/**/build/reports/tests/
            android/**/build/outputs/roborazzi/
          retention-days: 14

  android-device:
    name: Android tests on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # The runner's disk is nearly full of toolchains this build never uses.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Built before the emulator starts, with the daemon stopped after: the
      # runner has not the memory for both at once.
      - run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest && ./gradlew --stop
      # The whole app against a stand-in agent replaying recorded answers.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          disk-size: 4096M
          working-directory: android
          script: ./gradlew :app:connectedDebugAndroidTest -Dorg.gradle.jvmargs=-Xmx1536m -Pkotlin.daemon.jvmargs=-Xmx1g
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: device-test-reports
          path: android/app/build/reports/androidTests/
          retention-days: 14

  android-build:
    name: Build the APK
    needs: [android-lint, android-test, android-device]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: finance-companion-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
