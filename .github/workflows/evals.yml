name: Evaluations

# Started by hand: puts the evaluation questions to a real model through the
# agent and keeps the results. Uses the GEMINI_API_KEY repository secret.
on:
  workflow_dispatch:
    inputs:
      model:
        description: FC_MODEL, e.g. gemini:gemini-3.8-flash
        default: gemini:gemini-3.8-flash
      only:
        description: Question ids to run, separated by spaces (empty runs all)
        default: ""

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync
      - name: Run the questions
        env:
          FC_MODEL: ${{ inputs.model }}
          ONLY: ${{ inputs.only }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          name=$(echo "$FC_MODEL" | tr -c 'A-Za-z0-9.-' '_')
          if [ -n "$ONLY" ]; then set -- --only $ONLY; fi
          uv run python evals/run.py --out "evals/results/$name.json" "$@"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-results
          path: agent/evals/results/
